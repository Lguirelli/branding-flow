<html lang="pt-BR">

  <link rel="stylesheet" href="./styles.css" />

<body>
  <div id="app" class="app-shell">
    <div class="ambient ambient-a"></div>
    <div class="ambient ambient-b"></div>

    <header class="app-header" data-app-header hidden>
      <button class="brand-mark" data-go-intro type="button" aria-label="Voltar para início">
        <span class="brand-mark-dot"></span>
        Brand Flow
      </button>
      <div class="header-actions">
        <button class="ghost-btn" data-reset type="button">Resetar</button>
        <button class="primary-btn small" data-export type="button">Exportar JSON</button>
      </div>
    </header>

    <main id="view" class="view"></main>
  </div>

  <div id="modal-root"></div>

  <script src="./app.js"></script>
